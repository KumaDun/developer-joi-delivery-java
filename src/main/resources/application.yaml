spring:
  application:
    name: delivery
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
  datasource:
    url: jdbc:h2:mem:joidelivery
    username: sa
    password: password
    driverClassName: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
